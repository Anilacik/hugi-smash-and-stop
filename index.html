  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);

function addRush(row, li) {
  const n = row.length > 250 ? 2 : 1, len = 30 + Math.min(25, Math.round(li * .5));
  for (let j = n; j >= 1; j--) {
    const target = Math.floor(row.length * j / (n + 1));
    let at = row.indexOf('V', target); if (at < 0) continue;
    while (row[at] === 'V' || row[at] === 'p' && row[at + 1] === 'V') at++;
    at = Math.min(row.length, at + 2);
    const rp = len - 8, TL = Math.min(24, rp - 6);   // [ ] cam tünel, J rampa (. = boşluk)
    const run = 'r' + 'pp' + '[' + 'p'.repeat(TL - 1) + ']' + 'p'.repeat(rp - TL - 4) + '....J' + '.'.repeat(13) + 'p'.repeat(8);
    row = row.slice(0, at) + run + 'K' + 'pppppp' + row.slice(at);
  }
  return row;
}
